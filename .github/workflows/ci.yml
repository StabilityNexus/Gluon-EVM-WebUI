name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: WebUI checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests and coverage
        run: npm run test:coverage

      - name: Accessibility
        run: npm run test:a11y

      - name: Dependency security triage
        run: npm run security:audit

      - name: Production build
        run: npm run build 2>&1 | tee /tmp/next-build.log

      - name: Performance budget
        run: npm run performance -- /tmp/next-build.log
